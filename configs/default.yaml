# 服务器配置
server:
  port: 8080
  read_timeout: 15s
  write_timeout: 15s

# 日志配置
log:
  level: info
  format: text
  output: stdout
VERSION: 

# 数据库配置
database:
  driver: mysql
  dsn: root:password@tcp(localhost:3306)/devops?parseTime=true
  max_open_conns: 100
  max_idle_conns: 20
  conn_max_lifetime: 300s

# JWT配置
jwt:
  secret: your-secret-key
  expires_hours: 24

# 核心模块配置

  