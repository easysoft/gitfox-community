# GitFox 本地开发配置示例文件

# HTTP 服务配置
server:
  port: 3000
  host: localhost
  proto: http

# 数据库配置
database:
  driver: mysql
  datasource: root:pass4GitFox@tcp(mysql:3306)/gitfox
  printSQL: true
  maxIdleConn: 10
  maxOpenConn: 100
  connMaxLifeTime: 1800s # 1800s

sqlite:
  path: "./gitfox_sqlite.db"

# Docker配置
docker:
  apiVersion: 1.41

# git 配置
git:
  trace: true
  root: /data

# webhook 配置
webhook:
  allowLoopback: true
  allowPrivateNetwork: true

# SSH 服务配置
ssh:
  enable: true
  host: localhost
  port: 3322
  hostKeysDir: /tmp/gitfox/ssh

# 监控配置
metric:
  enabled: true

ci:
  pluginsZipUrl: https://pkg.zentao.net/gitfox/20240513/plugins.zip

gitspace:
  enable: true


registry:
  http:
    secret: changeit
  storage:
    storageType: filesystem
    filesystemStorage:
      rootDirectory: /tmp/gitfox/registry

# 日志配置
logging:
  level: -1                              # 日志输出的最低级别  -1~5：debug,info,warn,error,dpanic,panic,fatal
  stdout: false                          # 是否输出到终端？  true=是，false=否
  encoder: console                       # 日志编码格式，json 或 console，默认为 console
  maxAge: 90                             # 日志文件最大保存时间，单位：天，-1：禁用此选项
  maxCount: 20                           # 日志文件最大保存数量
  maxSize: 500                           # 日志文件切割大小，单位：MB
  levelColor: true                      # 日志级别颜色，默认为大写字母和彩色显示
  timeFormat: "2006-01-02 15:04:05.999"  # 时间格式字符串
  stackTraceLevel: 2                     # 打印堆栈跟踪的最低级别
  logAPIServerConf:
    path: /tmp/gitfox-community/logs/api.log
  logRunnerConf:
    path: /tmp/gitfox-community/logs/runner.log
  logSSHConf:
    path: /tmp/gitfox-community/logs/ssh.log
  logScanConf:
    path: /tmp/gitfox-community/logs/scan.log
  logSystemConf:
    path: /tmp/gitfox-community/logs/system.log

middleware:
  logRequestBody: true
  logResponseBody: true
  maxLoggedBodyBytes: 2048

# 环境变量
enviroment:
