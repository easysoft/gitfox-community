# GitFox 生产环境配置示例文件

# HTTP 服务配置
server:
  port: 3000
  host: 0.0.0.0
  proto: http
  shutdownTimeout: 10s  # 优雅关闭超时时间

# SSH 服务配置
ssh:
  enable: true
  host: 0.0.0.0
  port: 3322


# 数据库配置
database:
  printSQL: false
  slowThreshold: 500ms
  maxIdleConn: 10
  maxOpenConn: 100
  connMaxLifeTime: 3600s # 1800s

storage:
  storageType: filesystem
# git 配置
git:
  trace: true

# webhook 配置
webhook:
  allowLoopback: true
  allowPrivateNetwork: true

i18n:
  defaultLocale: zh-CN
  fallbackLocale: en-US
  translationsDir: locales
  supportedLocales: ["zh-CN", "en-US"]
  headerName: X-Locale
  autoLoad: true

# 监控配置
metric:
  enabled: true

gitspace:
  enable: true

registry:
  http:
    secret: changeit

# 日志配置
logging:
  level: 0                               # 日志输出的最低级别  -1~5：debug,info,warn,error,dpanic,panic,fatal
  stdout: false                          # 是否输出到终端？  true=是，false=否
  encoder: json                          # 日志编码格式，json 或 console，默认为 console
  maxAge: 90                             # 日志文件最大保存时间，单位：天，-1：禁用此选项
  maxCount: 20                           # 日志文件最大保存数量
  maxSize: 500                           # 日志文件切割大小，单位：MB
  levelColor: false                      # 日志级别颜色，默认为大写字母和彩色显示
  timeFormat: "2006-01-02 15:04:05.999"  # 时间格式字符串
  stackTraceLevel: 3                     # 打印堆栈跟踪的最低级别
  logAPIServerConf:
    filename: api.log
  logRunnerConf:
    filename: runner.log
  logSSHConf:
    filename: ssh.log
  logScanConf:
    filename: scan.log
  logSystemConf:
    filename: system.log
  logJobConf:
    filename: job.log
  logSQLConf:
    filename: sql.log

middleware:
  logRequestBody: true
  logResponseBody: true
  maxLoggedBodyBytes: 2048

# 制品库配置
artifact:
  recycleBinRetention: 720h  # 回收站保留时长，默认 30 天（720h），软删后此时间内可恢复
  gcInterval: 720h           # GC 定时任务间隔，默认 30 天（720h），不得小于 recycleBinRetention
