gitfox:
  level: -1                               # 日志输出的最低级别  -1~5：debug,info,warn,error,dpanic,panic,fatal
  stdout: false                           # 是否输出到终端？  true=是，false=否
  caller: false                           # 文件详细信息，true=显示，false=不显示 
  encoder: console                        # 日志编码格式，json 或 console，默认为 console
  max-age: 90                             # 日志文件最大保存时间，单位：天，-1：禁用此选项
  max-count: 20                           # 日志文件最大保存数量
  max-size: 500                           # 日志文件切割大小，单位：MB
  file-name: ./logs/gitfox.log            # 日志文件存放位置
  level-color: false                       # 日志级别颜色，默认为大写字母和彩色显示
  time-format: "2006-01-02 15:04:05.999"    # 时间格式字符串
  stack-trace-level: 2                    # 打印堆栈跟踪的最低级别