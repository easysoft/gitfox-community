      responses:
        "200":
          description: 查询成功
          schema:
            $ref: '#/definitions/gitfox_zcorp_cc_git_Pangu_gitfox-community_app_api_utils_resp.ObjectResponse'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/gitfox_zcorp_cc_git_Pangu_gitfox-community_app_api_utils_resp.ObjectResponse'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/gitfox_zcorp_cc_git_Pangu_gitfox-community_app_api_utils_resp.ObjectResponse'
      summary: 查询流水线步骤表单配置
      tags:
