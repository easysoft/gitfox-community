        required: true
        type: string
      - description: 制品库名称（ops_artifact.name）
        in: path
        name: artifactname
        required: true
        type: string
      - description: 镜像名称
        in: path
        name: imagename
        required: true
        type: string
      - description: Blob 摘要 (如 sha256:abc123...)
        in: path
        name: digest
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: 删除成功
        "401":
          description: 未认证
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Blob 不存在
          schema:
            additionalProperties: true
            type: object
      summary: 删除 Blob
      tags:
      - container
    get:
      description: 根据 digest 下载指定容器镜像空间下的 Blob 内容（镜像层数据）。
      parameters:
      - description: 作用域标识（global / space{ID} / repo{ID}）
        in: path
        name: domainid
        required: true
        type: string
      - description: 制品库名称（ops_artifact.name）
        in: path
        name: artifactname
        required: true
        type: string
      - description: 镜像名称
        in: path
        name: imagename
        required: true
        type: string
      - description: Blob 摘要 (如 sha256:abc123...)
        in: path
        name: digest
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: Blob 内容
          schema:
            type: file
        "401":
          description: 未认证
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Blob 不存在
          schema:
            additionalProperties: true
            type: object
      summary: 下载 Blob
      tags:
      - container
    head:
      description: 根据 digest 检查指定容器镜像空间下的 Blob 是否存在，返回 Content-Length 等元信息。
      parameters:
      - description: 作用域标识（global / space{ID} / repo{ID}）
        in: path
        name: domainid
        required: true
        type: string
      - description: 制品库名称（ops_artifact.name）
        in: path
        name: artifactname
        required: true
        type: string
      - description: 镜像名称
        in: path
        name: imagename
        required: true
        type: string
      - description: Blob 摘要 (如 sha256:abc123...)
        in: path
        name: digest
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Blob 存在，响应头包含 Content-Length 和 Docker-Content-Digest
        "401":
          description: 未认证
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Blob 不存在
          schema:
            additionalProperties: true
            type: object
      summary: 检查 Blob 是否存在
      tags:
      - container
  /v2/{domainid}/{artifactname}/{imagename}/blobs/uploads/:
    post:
      consumes:
      - application/octet-stream
      description: 发起一个新的 Blob 上传会话。如果 query 中包含 digest 参数则执行单次上传（monolithic），否则初始化分块上传。
      parameters:
      - description: 作用域标识（global / space{ID} / repo{ID}）
        in: path
        name: domainid
        required: true
        type: string
      - description: 制品库名称（ops_artifact.name）
        in: path
        name: artifactname
        required: true
        type: string
      - description: 镜像名称
        in: path
        name: imagename
        required: true
        type: string
      - description: Blob 摘要（传入时执行单次上传）
        in: query
        name: digest
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: 上传会话已创建，响应头包含 Location 和 Docker-Upload-UUID
        "401":
          description: 未认证
          schema:
            additionalProperties: true
            type: object
        "404":
          description: 空间或镜像不存在
          schema:
            additionalProperties: true
            type: object
      summary: 发起 Blob 上传
      tags:
      - container
  /v2/{domainid}/{artifactname}/{imagename}/blobs/uploads/{uuid}:
    delete:
      description: 取消正在进行的分块上传会话，释放已上传的临时数据。
      parameters:
      - description: 作用域标识（global / space{ID} / repo{ID}）
        in: path
        name: domainid
        required: true
        type: string
      - description: 制品库名称（ops_artifact.name）
        in: path
        name: artifactname
        required: true
        type: string
      - description: 镜像名称
        in: path
        name: imagename
        required: true
        type: string
      - description: 上传会话 UUID
        in: path
        name: uuid
        required: true
        type: string
      - description: 上传状态 token
        in: query
        name: _state
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: 取消成功
        "401":
          description: 未认证
          schema:
            additionalProperties: true
            type: object
        "404":
          description: 上传会话不存在
          schema:
            additionalProperties: true
            type: object
      summary: 取消 Blob 上传
      tags:
      - container
    get:
      description: 查询分块上传会话的当前状态，返回已上传的字节范围。
      parameters:
      - description: 作用域标识（global / space{ID} / repo{ID}）
        in: path
        name: domainid
        required: true
        type: string
      - description: 制品库名称（ops_artifact.name）
        in: path
        name: artifactname
        required: true
        type: string
      - description: 镜像名称
        in: path
        name: imagename
        required: true
        type: string
      - description: 上传会话 UUID
        in: path
        name: uuid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: 查询成功，响应头包含 Range 和 Docker-Upload-UUID
        "401":
          description: 未认证
          schema:
            additionalProperties: true
            type: object
        "404":
          description: 上传会话不存在
          schema:
            additionalProperties: true
            type: object
      summary: 查询 Blob 上传状态
      tags:
      - container
    patch:
      consumes:
      - application/octet-stream
      description: 向正在进行的分块上传会话追加数据。请求体为原始字节流。
      parameters:
      - description: 作用域标识（global / space{ID} / repo{ID}）
        in: path
        name: domainid
        required: true
        type: string
      - description: 制品库名称（ops_artifact.name）
        in: path
        name: artifactname
        required: true
        type: string
      - description: 镜像名称
        in: path
        name: imagename
        required: true
        type: string
      - description: 上传会话 UUID
        in: path
        name: uuid
        required: true
        type: string
      - description: 上传状态 token
        in: query
        name: _state
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: 数据追加成功，响应头包含 Range 和 Docker-Upload-UUID
        "401":
          description: 未认证
          schema:
            additionalProperties: true
            type: object
        "404":
          description: 上传会话不存在
          schema:
            additionalProperties: true
            type: object
      summary: 追加 Blob 分块数据
      tags:
      - container
    put:
      consumes:
      - application/octet-stream
      description: 完成分块上传会话，可选附带最后一块数据。必须在 query 中提供最终 digest 校验。
      parameters:
      - description: 作用域标识（global / space{ID} / repo{ID}）
        in: path
        name: domainid
        required: true
        type: string
      - description: 制品库名称（ops_artifact.name）
        in: path
        name: artifactname
        required: true
        type: string
      - description: 镜像名称
        in: path
        name: imagename
        required: true
        type: string
      - description: 上传会话 UUID
        in: path
        name: uuid
        required: true
        type: string
      - description: 最终 Blob 摘要
        in: query
        name: digest
        required: true
        type: string
      - description: 上传状态 token
        in: query
        name: _state
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: 上传完成，响应头包含 Docker-Content-Digest 和 Location
        "401":
          description: 未认证
          schema:
            additionalProperties: true
            type: object
        "404":
          description: 上传会话不存在
          schema:
            additionalProperties: true
            type: object
      summary: 完成 Blob 上传
      tags:
      - container
  /v2/{domainid}/{artifactname}/{imagename}/manifests/{reference}:
