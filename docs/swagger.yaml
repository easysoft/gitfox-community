host: localhost:3000
info:
  contact: {}
  description: GitFox 平台 API 文档
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: GitFox API
  version: "1.0"
paths:
  /artifacts:
    post:
      consumes:
      - application/json
      description: 创建一个制品库视图 (测试用)
      parameters:
      - description: 创建参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/gitfox_zcorp_cc_git_Pangu_gitfox-community_app_model_artifact.CreateArtifactViewReq'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/gitfox_zcorp_cc_git_Pangu_gitfox-community_app_api_utils_resp.ObjectResponse'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/gitfox_zcorp_cc_git_Pangu_gitfox-community_app_api_utils_resp.ObjectResponse'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/gitfox_zcorp_cc_git_Pangu_gitfox-community_app_api_utils_resp.ObjectResponse'
      summary: 创建制品库视图
      tags:
      - artifacts
  /artifacts/assets/{assetID}:
    get:
      consumes:
      - application/json
      description: 获取指定制品文件的详细信息
      parameters:
      - description: 文件ID
        in: path
        name: assetID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/gitfox_zcorp_cc_git_Pangu_gitfox-community_app_api_utils_resp.ObjectResponse'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/gitfox_zcorp_cc_git_Pangu_gitfox-community_app_api_utils_resp.ObjectResponse'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/gitfox_zcorp_cc_git_Pangu_gitfox-community_app_api_utils_resp.ObjectResponse'
      summary: 查询文件详情
      tags:
      - artifacts
  /artifacts/assets/{assetID}/download:
    get:
      description: 下载制品文件
      parameters:
      - description: 文件ID
        in: path
        name: assetID
        required: true
        type: integer
      produces:
      - application/octet-stream
      responses:
        "200":
          description: 文件流
          schema:
            type: file
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/gitfox_zcorp_cc_git_Pangu_gitfox-community_app_api_utils_resp.ObjectResponse'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/gitfox_zcorp_cc_git_Pangu_gitfox-community_app_api_utils_resp.ObjectResponse'
      summary: 下载文件
      tags:
      - artifacts
  /artifacts/assets/list:
    post:
      consumes:
      - application/json
      description: 按 entityID（group.{id} 或 version.{id}）分页查询资产列表，支持过滤和排序；group 查询传
        more=true 时递归包含子目录资产
      parameters:
      - description: 分页查询请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/gitfox_zcorp_cc_git_Pangu_gitfox-community_app_model_artifact.ListAssetReq'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/gitfox_zcorp_cc_git_Pangu_gitfox-community_app_api_utils_resp.ObjectResponse'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/gitfox_zcorp_cc_git_Pangu_gitfox-community_app_api_utils_resp.ObjectResponse'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/gitfox_zcorp_cc_git_Pangu_gitfox-community_app_api_utils_resp.ObjectResponse'
      summary: 制品资产分页列表
      tags:
      - artifacts
  /artifacts/entities:
    delete:
      consumes:
      - application/json
      description: 按 entityIDs 批量软删除 asset/version/package/group
      parameters:
      - description: 实体ID列表，仅支持 entityIDs，元素格式为 type.id
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/gitfox_zcorp_cc_git_Pangu_gitfox-community_app_model_artifact.SoftRemoveEntitiesReq'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/gitfox_zcorp_cc_git_Pangu_gitfox-community_app_api_utils_resp.ObjectResponse'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/gitfox_zcorp_cc_git_Pangu_gitfox-community_app_api_utils_resp.ObjectResponse'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/gitfox_zcorp_cc_git_Pangu_gitfox-community_app_api_utils_resp.ObjectResponse'
      summary: 按实体批量软删除制品
      tags:
      - artifacts
  /artifacts/entities/relocate:
    post:
      consumes:
      - application/json
      description: |-
        同时支持移动和重命名 package / asset / group。targetGroupID 显式传 0 表示根目录（仅 file group 支持）；
        不传 targetGroupID 表示不移动，仍可正常执行重命名；两者都不变则直接成功。整个过程在单事务内完成。
      parameters:
      - description: 移动并/或重命名请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/gitfox_zcorp_cc_git_Pangu_gitfox-community_app_model_artifact.RelocateEntityReq'
      produces:
      - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/gitfox_zcorp_cc_git_Pangu_gitfox-community_app_api_utils_resp.ObjectResponse'
        "400":
          description: 参数错误或业务校验失败
          schema:
            $ref: '#/definitions/gitfox_zcorp_cc_git_Pangu_gitfox-community_app_api_utils_resp.ObjectResponse'
      summary: 移动并/或重命名制品实体
      tags:
      - artifacts
  /artifacts/groups:
    post:
      consumes:
      - application/json
      description: 创建 group 节点。artifactID 必传且必须大于 0。group 的 format 自动从 artifactID
        对应视图中反查，前端不需要传 format。
