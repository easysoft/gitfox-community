basePath: /api/v2
definitions:
  gitfox_zcorp_cc_git_Pangu_gitfox-community_app_api_utils_resp.ListResponse:
    properties:
      code:
        $ref: '#/definitions/gitfox_zcorp_cc_git_Pangu_gitfox-community_pkg_i18n.I18nKey'
      data: {}
      message:
        type: string
      page:
        type: integer
      pageSize:
        type: integer
      total:
        type: integer
      traceID:
        type: string
    type: object
  gitfox_zcorp_cc_git_Pangu_gitfox-community_app_api_utils_resp.ObjectResponse:
    properties:
      code:
        $ref: '#/definitions/gitfox_zcorp_cc_git_Pangu_gitfox-community_pkg_i18n.I18nKey'
      data: {}
      message:
        type: string
      traceID:
        type: string
    type: object
  gitfox_zcorp_cc_git_Pangu_gitfox-community_app_model_branch.Branch:
    properties:
      commit:
        $ref: '#/definitions/gitfox_zcorp_cc_git_Pangu_gitfox-community_app_model_commit.Commit'
      commitDivergence:
        $ref: '#/definitions/gitfox_zcorp_cc_git_Pangu_gitfox-community_app_model_commit.CommitDivergence'
      is_default:
        type: boolean
      name:
        type: string
      sha:
        type: string
    type: object
  gitfox_zcorp_cc_git_Pangu_gitfox-community_app_model_branch.Prefix:
    properties:
      name:
        type: string
      total:
        type: integer
    type: object
  gitfox_zcorp_cc_git_Pangu_gitfox-community_app_model_branch.ReqForCreate:
    properties:
      name:
        example: dev
        maxLength: 100
        type: string
      repoID:
        type: integer
      source:
        type: string
    required:
    - name
    - repoID
    type: object
  gitfox_zcorp_cc_git_Pangu_gitfox-community_app_model_commit.ChangeStats:
    properties:
      changes:
        type: integer
      deletions:
        type: integer
      insertions:
        type: integer
    type: object
  gitfox_zcorp_cc_git_Pangu_gitfox-community_app_model_commit.Commit:
    properties:
      author:
        $ref: '#/definitions/gitfox_zcorp_cc_git_Pangu_gitfox-community_app_model_commit.Signature'
      committer:
        $ref: '#/definitions/gitfox_zcorp_cc_git_Pangu_gitfox-community_app_model_commit.Signature'
      message:
        type: string
      parent_shas:
        items:
          type: string
        type: array
      sha:
        type: string
      stats:
        $ref: '#/definitions/gitfox_zcorp_cc_git_Pangu_gitfox-community_app_model_commit.CommitStats'
      title:
        type: string
    type: object
  gitfox_zcorp_cc_git_Pangu_gitfox-community_app_model_commit.CommitDivergence:
    properties:
      ahead:
        description: Ahead is the count of commits the 'From' ref is ahead of the
          'To' ref.
        type: integer
      behind:
        description: Behind is the count of commits the 'From' ref is behind the 'To'
          ref.
        type: integer
    type: object
  gitfox_zcorp_cc_git_Pangu_gitfox-community_app_model_commit.CommitFileStats:
    properties:
      changes:
        type: integer
      deletions:
        type: integer
      insertions:
        type: integer
      old_path:
        type: string
      path:
        type: string
      status:
        $ref: '#/definitions/gitfox_zcorp_cc_git_Pangu_gitfox-community_pkg_git_enum.FileDiffStatus'
    type: object
  gitfox_zcorp_cc_git_Pangu_gitfox-community_app_model_commit.CommitStats:
    properties:
      files:
        items:
          $ref: '#/definitions/gitfox_zcorp_cc_git_Pangu_gitfox-community_app_model_commit.CommitFileStats'
        type: array
      total:
        $ref: '#/definitions/gitfox_zcorp_cc_git_Pangu_gitfox-community_app_model_commit.ChangeStats'
    type: object
  gitfox_zcorp_cc_git_Pangu_gitfox-community_app_model_commit.Identity:
    properties:
      email:
        type: string
      name:
        type: string
    type: object
  gitfox_zcorp_cc_git_Pangu_gitfox-community_app_model_commit.Signature:
    properties:
      identity:
        $ref: '#/definitions/gitfox_zcorp_cc_git_Pangu_gitfox-community_app_model_commit.Identity'
      when:
        type: string
    type: object
  gitfox_zcorp_cc_git_Pangu_gitfox-community_app_model_repo.CreateRepoReq:
    properties:
      acl:
        description: 权限（仅支持open/private）
        enum:
        - open
        - private
        type: string
      defaultBranch:
        description: 默认分支（默认main）
        type: string
      desc:
        description: 仓库描述（最大500字符）
        maxLength: 500
        type: string
      forkID:
        description: 派生来源ID（可选）
        type: integer
      identifier:
        description: 仓库唯一标识
        type: string
      ignore:
        description: GitIgnore类型（如go/java）
        type: string
      license:
        description: 许可证类型（如mit/apache）
        type: string
      readme:
        description: 是否生成README.md
        type: boolean
      spaceID:
        description: 空间ID（字符串类型，后续转int）
        type: integer
    required:
    - acl
    - identifier
    - spaceID
    type: object
  gitfox_zcorp_cc_git_Pangu_gitfox-community_app_model_repo.CreateRepoResp:
    properties:
      acl:
        type: string
      createdBy:
        type: string
      createdDate:
        description: 允许 NULL，用指针类型
        type: string
      defaultBranch:
        type: string
      deleted:
        type: boolean
      desc:
        type: string
      editedBy:
        type: string
      editedDate:
        description: 允许 NULL，用指针类型
        type: string
      empty:
        type: boolean
      forkID:
        description: 允许 NULL，用指针类型
        type: integer
      gitUID:
        type: string
      id:
        type: integer
      identifier:
        type: string
      mirror:
        type: boolean
      mutex:
        type: integer
      spaceID:
        type: integer
      status:
        description: 状态码用 int 类型（兼容枚举映射）
        type: integer
    type: object
  gitfox_zcorp_cc_git_Pangu_gitfox-community_app_model_space.CreateSpaceRequest:
    properties:
      acl:
        enum:
        - open
        - private
        example: open
        type: string
      createdBy:
        type: string
      desc:
        type: string
      name:
        example: 测试空间01
        maxLength: 200
        type: string
      owner:
        type: string
    required:
    - acl
    - createdBy
    - name
    - owner
    type: object
  gitfox_zcorp_cc_git_Pangu_gitfox-community_app_model_space.SpaceResponse:
    properties:
      acl:
        type: string
      createdBy:
        type: string
      createdDate:
        type: string
      desc:
        type: string
      editedBy:
        type: string
      editedDate:
        type: string
      id:
        type: integer
      name:
        type: string
      owner:
        type: string
    type: object
  gitfox_zcorp_cc_git_Pangu_gitfox-community_app_model_space.UndeleteSpaceRequest:
    properties:
      editedBy:
        example: admin
        type: string
      ids:
        example:
        - 1
        - 2
        - 3
        items:
          type: integer
        minItems: 1
        type: array
    required:
    - editedBy
    - ids
    type: object
  gitfox_zcorp_cc_git_Pangu_gitfox-community_app_model_space.UpdateSpaceRequest:
    properties:
      acl:
        enum:
        - open
        - private
        type: string
      desc:
        type: string
      editedBy:
        type: string
      name:
        type: string
      owner:
        type: string
    required:
    - editedBy
    type: object
  gitfox_zcorp_cc_git_Pangu_gitfox-community_app_model_tag.ReqForCreate:
    properties:
      message:
        type: string
      name:
        type: string
      repoID:
        type: integer
      source:
        type: string
    required:
    - name
    - repoID
    type: object
  gitfox_zcorp_cc_git_Pangu_gitfox-community_app_model_tag.Tag:
    properties:
      commit:
        $ref: '#/definitions/gitfox_zcorp_cc_git_Pangu_gitfox-community_app_model_commit.Commit'
      createdBy:
        $ref: '#/definitions/gitfox_zcorp_cc_git_Pangu_gitfox-community_app_model_commit.Signature'
      message:
        type: string
      name:
        type: string
      sha:
        type: string
    type: object
  gitfox_zcorp_cc_git_Pangu_gitfox-community_pkg_git_enum.FileDiffStatus:
    enum:
    - UNDEFINED
    - ADDED
    - MODIFIED
    - DELETED
    - RENAMED
    - COPIED
