    put:
      consumes:
      - application/vnd.docker.distribution.manifest.v2+json
      description: 上传容器镜像的 Manifest（docker push 的核心步骤）。reference 可以是 tag 或 digest。
      parameters:
      - description: 作用域标识（global / space{ID} / repo{ID}）
