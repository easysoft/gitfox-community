host: localhost:3000
info:
  contact: {}
  description: GitFox 平台 API 文档
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: GitFox API
  version: "1.0"
paths:
  /git/{spaceID}/{repoRef}/git-receive-pack:
    post:
      consumes:
      - application/x-git-receive-pack-request
      description: 处理 Git 客户端的 push 请求，通过 receive-pack 协议接收仓库对象数据并更新引用
      parameters:
      - description: 空间ID
        in: path
        name: spaceID
        required: true
        type: integer
      - description: 仓库标识 (支持 .git 后缀)
        in: path
        name: repoRef
        required: true
        type: string
      - description: 内容编码 (如 gzip)
        in: header
        name: Content-Encoding
        type: string
      - description: Git 协议版本
        in: header
        name: Git-Protocol
        type: string
      produces:
      - application/x-git-receive-pack-result
      responses:
        "200":
          description: 成功接收并处理 Git pack 数据
          schema:
            type: string
        "400":
          description: 参数错误或权限不足
          schema:
            $ref: '#/definitions/gitfox_zcorp_cc_git_Pangu_gitfox-community_app_api_utils_resp.ObjectResponse'
        "404":
          description: 仓库不存在
          schema:
            $ref: '#/definitions/gitfox_zcorp_cc_git_Pangu_gitfox-community_app_api_utils_resp.ObjectResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/gitfox_zcorp_cc_git_Pangu_gitfox-community_app_api_utils_resp.ObjectResponse'
      summary: Git Push 操作
      tags:
      - git
  /git/{spaceID}/{repoRef}/git-upload-pack:
    post:
      consumes:
      - application/x-git-upload-pack-request
      description: 处理 Git 客户端的 clone 和 fetch 请求，通过 upload-pack 协议发送仓库对象数据
      parameters:
      - description: 空间ID
        in: path
        name: spaceID
        required: true
        type: integer
      - description: 仓库标识 (支持 .git 后缀)
        in: path
        name: repoRef
        required: true
        type: string
      - description: 内容编码 (如 gzip)
        in: header
        name: Content-Encoding
        type: string
      - description: Git 协议版本
        in: header
        name: Git-Protocol
        type: string
      produces:
      - application/x-git-upload-pack-result
      responses:
        "200":
          description: 成功返回 Git pack 数据
          schema:
            type: string
        "400":
          description: 参数错误或权限不足
          schema:
            $ref: '#/definitions/gitfox_zcorp_cc_git_Pangu_gitfox-community_app_api_utils_resp.ObjectResponse'
        "404":
          description: 仓库不存在
          schema:
            $ref: '#/definitions/gitfox_zcorp_cc_git_Pangu_gitfox-community_app_api_utils_resp.ObjectResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/gitfox_zcorp_cc_git_Pangu_gitfox-community_app_api_utils_resp.ObjectResponse'
      summary: Git Clone/Fetch 操作
      tags:
      - git
  /git/{spaceID}/{repoRef}/info/refs:
    get:
      consumes:
      - '*/*'
      description: 处理 Git 客户端的 info/refs 请求，返回仓库的引用信息(分支、标签等)，用于 Smart HTTP 协议的初始握手
      parameters:
      - description: 空间ID
        in: path
        name: spaceID
        required: true
        type: integer
      - description: 仓库标识 (支持 .git 后缀)
        in: path
        name: repoRef
        required: true
        type: string
      - description: Git 服务类型
        enum:
        - git-upload-pack
        - git-receive-pack
        in: query
        name: service
        required: true
        type: string
      - description: Git 协议版本
        in: header
        name: Git-Protocol
        type: string
      produces:
      - application/x-git-upload-pack-advertisement
      - application/x-git-receive-pack-advertisement
      responses:
        "200":
          description: 成功返回引用广告信息
          schema:
            type: string
        "400":
          description: 参数错误或权限不足
          schema:
            $ref: '#/definitions/gitfox_zcorp_cc_git_Pangu_gitfox-community_app_api_utils_resp.ObjectResponse'
        "404":
          description: 仓库不存在
          schema:
            $ref: '#/definitions/gitfox_zcorp_cc_git_Pangu_gitfox-community_app_api_utils_resp.ObjectResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/gitfox_zcorp_cc_git_Pangu_gitfox-community_app_api_utils_resp.ObjectResponse'
      summary: Git Info/Refs 请求
      tags:
      - git
  /pipeline/executions:
    post:
      consumes:
      - application/json
      description: 创建新的流水线执行
      parameters:
      - description: 创建流水线执行的请求参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/gitfox_zcorp_cc_git_Pangu_gitfox-community_app_model_execution.ReqForCreate'
