basePath: /api/v2
definitions:
  resp.ListResponse:
    properties:
      code:
        type: string
      data: {}
      message:
        type: string
      total:
        type: integer
      traceID:
        type: string
    type: object
  resp.ObjectResponse:
    properties:
      code:
        type: string
      data: {}
      message:
        type: string
      traceID:
        type: string
    type: object
  space.CreateSpaceRequest:
    properties:
      acl:
        enum:
        - open
        - private
        example: open
        type: string
      createdBy:
        type: string
      desc:
        type: string
      name:
        example: 测试空间01
        maxLength: 200
        type: string
      owner:
        type: string
    required:
    - acl
    - createdBy
    - name
    - owner
    type: object
  space.SpaceResponse:
    properties:
      acl:
        type: string
      createdBy:
        type: string
      createdDate:
        type: string
      desc:
        type: string
      editedBy:
        type: string
      editedDate:
        type: string
      id:
        type: integer
      name:
        type: string
      owner:
        type: string
    type: object
  space.UndeleteSpaceRequest:
    properties:
      editedBy:
        example: admin
        type: string
      ids:
        example:
        - 1
        - 2
        - 3
        items:
          type: integer
        minItems: 1
        type: array
    required:
    - editedBy
    - ids
    type: object
  space.UpdateSpaceRequest:
    properties:
      acl:
        type: string
      desc:
        type: string
      editedBy:
        type: string
      name:
        type: string
      owner:
        type: string
    type: object
host: localhost:3000
info:
  contact: {}
  description: GitFox 平台 API 文档
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: GitFox API
  version: "1.0"
paths:
  /spaces:
    get:
      consumes:
      - application/json
      description: 分页查询空间列表，支持按名称、权限、负责人筛选
      parameters:
      - description: 空间名称（模糊查询）
        in: query
        name: name
        type: string
      - description: 空间权限（open-私有，private-公开）
        enum:
        - open
        - private
        in: query
        name: permission
        type: string
      - description: 负责人
        in: query
        name: owner
        type: string
      - default: 1
        description: 页码（默认1）
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: 每页条数（默认20）
        in: query
        maximum: 100
        minimum: 1
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功
          schema:
            allOf:
            - $ref: '#/definitions/resp.ListResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/space.SpaceResponse'
                  type: array
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/resp.ListResponse'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/resp.ListResponse'
      summary: 查询空间列表
      tags:
      - spaces
    post:
      consumes:
      - application/json
      description: 新增一个空间，需保证未删除空间中名称唯一，负责人默认为当前用户
      parameters:
      - description: 创建空间请求参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/space.CreateSpaceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功
          schema:
            allOf:
            - $ref: '#/definitions/resp.ObjectResponse'
            - properties:
                data:
                  $ref: '#/definitions/space.SpaceResponse'
              type: object
        "400":
          description: 参数错误（如名称重复）
          schema:
            $ref: '#/definitions/resp.ObjectResponse'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/resp.ObjectResponse'
      summary: 创建空间
      tags:
      - spaces
  /spaces/{id}:
    delete:
      consumes:
      - application/json
      description: 逻辑删除空间，删除前需校验空间下无代码库和制品库
      parameters:
      - description: 空间ID
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            $ref: '#/definitions/resp.ObjectResponse'
        "400":
          description: ID格式错误
          schema:
            $ref: '#/definitions/resp.ObjectResponse'
        "404":
          description: 空间不存在或已删除
          schema:
            $ref: '#/definitions/resp.ObjectResponse'
        "500":
          description: 删除失败（如存在关联资源）
          schema:
            $ref: '#/definitions/resp.ObjectResponse'
      summary: 删除空间
      tags:
      - spaces
    get:
      consumes:
      - application/json
      description: 根据ID查询单个空间详情
      parameters:
      - description: 空间ID
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功
          schema:
            allOf:
            - $ref: '#/definitions/resp.ObjectResponse'
            - properties:
                data:
                  $ref: '#/definitions/space.SpaceResponse'
              type: object
        "400":
          description: ID格式错误
          schema:
            $ref: '#/definitions/resp.ObjectResponse'
        "404":
          description: 空间不存在或已删除
          schema:
            $ref: '#/definitions/resp.ObjectResponse'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/resp.ObjectResponse'
      summary: 查询单个空间
      tags:
      - spaces
    put:
      consumes:
      - application/json
      description: 根据ID更新空间信息，未传入字段保持原值，名称更新需重新校验唯一性
      parameters:
      - description: 空间ID
        in: path
        minimum: 1
        name: id
        required: true
        type: integer
      - description: 更新空间请求参数（字段可选）
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/space.UpdateSpaceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            allOf:
            - $ref: '#/definitions/resp.ObjectResponse'
            - properties:
                data:
                  $ref: '#/definitions/space.SpaceResponse'
              type: object
        "400":
          description: 参数错误（如名称重复）
          schema:
            $ref: '#/definitions/resp.ObjectResponse'
        "404":
          description: 空间不存在或已删除
          schema:
            $ref: '#/definitions/resp.ObjectResponse'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/resp.ObjectResponse'
      summary: 更新空间
      tags:
      - spaces
  /spaces/undelete:
    post:
      consumes:
      - application/json
      description: 恢复已逻辑删除的空间
      parameters:
      - description: 恢复空间请求参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/space.UndeleteSpaceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 恢复成功
          schema:
            $ref: '#/definitions/resp.ObjectResponse'
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/resp.ObjectResponse'
        "404":
          description: 空间不存在或未删除
          schema:
            $ref: '#/definitions/resp.ObjectResponse'
        "500":
          description: 恢复失败
          schema:
            $ref: '#/definitions/resp.ObjectResponse'
      summary: 恢复已删除空间
      tags:
      - spaces
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
