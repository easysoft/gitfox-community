paths:
  /branches:
    post:
      consumes:
      - application/json
      description: 新增一个分支
      parameters:
      - description: 创建分支请求参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/gitfox_zcorp_cc_git_Pangu_gitfox-community_app_model_branch.ReqForCreate'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功
          schema:
            allOf:
            - $ref: '#/definitions/gitfox_zcorp_cc_git_Pangu_gitfox-community_app_api_utils_resp.ObjectResponse'
            - properties:
                data:
                  $ref: '#/definitions/gitfox_zcorp_cc_git_Pangu_gitfox-community_app_model_branch.Branch'
              type: object
        "400":
          description: 参数错误（如名称重复）
          schema:
            $ref: '#/definitions/gitfox_zcorp_cc_git_Pangu_gitfox-community_app_api_utils_resp.ObjectResponse'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/gitfox_zcorp_cc_git_Pangu_gitfox-community_app_api_utils_resp.ObjectResponse'
      summary: 创建分支
      tags:
      - branches
  /branches/list:
    post:
      consumes:
      - application/json
      description: 分页查询分支列表
      parameters:
      - description: 创建分支请求参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/gitfox_zcorp_cc_git_Pangu_gitfox-community_app_model_branch.ReqFilter'
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功
          schema:
            allOf:
            - $ref: '#/definitions/gitfox_zcorp_cc_git_Pangu_gitfox-community_app_api_utils_resp.ListResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/gitfox_zcorp_cc_git_Pangu_gitfox-community_app_model_branch.Branch'
                  type: array
              type: object
        "400":
          description: 参数错误
          schema:
            $ref: '#/definitions/gitfox_zcorp_cc_git_Pangu_gitfox-community_app_api_utils_resp.ListResponse'
        "500":
          description: 服务器错误
          schema:
            $ref: '#/definitions/gitfox_zcorp_cc_git_Pangu_gitfox-community_app_api_utils_resp.ListResponse'
      summary: 查询分支列表
      tags:
      - branches
  /branches/prefixes:
    get:
      consumes:
      - application/json
      description: 查询分支标签
      parameters:
      - description: 仓库 ID
        in: query
        name: repoID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功
          schema:
            allOf:
            - $ref: '#/definitions/gitfox_zcorp_cc_git_Pangu_gitfox-community_app_api_utils_resp.ListResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/gitfox_zcorp_cc_git_Pangu_gitfox-community_app_model_branch.Prefix'
