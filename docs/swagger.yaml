      - description: 镜像名称
        in: path
        name: imagename
        required: true
        type: string
      - description: 引用（tag 名称或 digest）
        in: path
        name: reference
        required: true
        type: string
      produces:
      - application/vnd.docker.distribution.manifest.v2+json
      responses:
        "200":
          description: Manifest 存在，响应头包含 Content-Length 和 Docker-Content-Digest
        "401":
          description: 未认证
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Manifest 不存在
          schema:
            additionalProperties: true
            type: object
      summary: 检查 Manifest 是否存在
