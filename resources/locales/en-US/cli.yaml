cli:
  server: "server"
  server_description: "starts the server"
  server_mode_arg: "set the server mode"
  server_enable_ci_flag: "start ci runners for build executions"
  hooks_command: "hooks"
  hooks_description: "manage git server hooks"
  hooks_pre_receive_description: "hook that is executed before any reference of the push is updated"
  hooks_update_description: "hook that is executed before the specific reference gets updated"
  hooks_update_ref_arg: "reference for which the hook is executed"
  hooks_update_old_arg: "old commit sha"
  hooks_update_new_arg: "new commit sha"
  hooks_post_receive_description: "hook that is executed after all references of the push got updated"
  install_command: "install"
  install_description: "install GitFox"
  install_init_description: "initialize GitFox configuration"
  install_start_description: "start the GitFox service"