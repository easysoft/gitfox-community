version: 1
kind: pipeline
spec:
  options:
    clone:
      disabled: true
  stages:
    - name: codescan
      type: ci
      spec:
        steps:
          - name: git clone
            type: plugin
            spec:
              name: scm_git_clone
              inputs:
                repository: ${{parameters.gitURL}}
                gitRef: ${{parameters.gitRef}}
                cloneDepth: 50
                cloneDir: ""
          - name: codescan
            type: plugin
            spec:
              name: codescan
