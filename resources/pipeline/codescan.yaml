version: 1
kind: pipeline
spec:
  options:
    clone:
      disabled: true
  stages:
    - name: codescan
      type: ci
      spec:
        steps:
          - name: clone
            type: run
            spec:
              container:
                image: qucheng.tencentcloudcr.com/ci/gitfox-plugin:alpine-git
                pull: always
              script:
                - rm -rf /gitfox/*/
                - git clone ${{parameters.gitURL}} --branch ${{parameters.gitRef}} --depth 5
          - name: codescan
            type: run
            spec:
              container:
                image: hub.zentao.net/ci/gitfoxscan:gitfox-community
                pull: always
