version: 1
kind: pipeline
spec:
  options:
    clone:
      disabled: true
  stages:
    - name: codescan
      type: ci
      spec:
        steps:
          - name: clone
            type: run
            spec:
              container:
                image: qucheng.tencentcloudcr.com/ci/gitfox-plugin:alpine-git
                pull: always
              script:
                - git clone http://10.0.4.11:3000/git/1/repo20260202.git
          - name: dotnet
            type: background
            spec:
              container:
                image: hub.zentao.net/ci/dotnet-scanner
                pull: always
          - name: codescan
            type: run
            spec:
              container:
                image: hub.zentao.net/ci/gitfoxscan:main
                pull: always
