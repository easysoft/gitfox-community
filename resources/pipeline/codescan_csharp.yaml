version: 1
kind: pipeline
spec:
  options:
    clone:
      disabled: true
  stages:
    - name: codescan
      type: ci
      spec:
        steps:
          - name: git clone
            type: plugin
            spec:
              name: scm_git_clone
              inputs:
                repository: ${{parameters.gitURL}}
                gitRef: ${{parameters.gitRef}}
                cloneDepth: 50
                cloneDir: ""
          - name: dotnet
            type: background
            spec:
              container:
                image: hub.zentao.net/ci/dotnet-scanner
                pull: if-not-exists
          - name: codescan
            type: run
            spec:
              container:
                image: hub.zentao.net/ci/gitfoxscan:gitfox-community
                pull: if-not-exists
