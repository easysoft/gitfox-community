{
  "kind": "plugin",
  "type": "step",
  "name": "wechat",
  "spec": {
    "name": "Wechat",
    "description": "The Wechat plugin build by gitfox posts build status messages",
    "step": {
      "type": "script",
      "spec": {
        "image": "hub.zentao.net/ci/gitfox-wechat",
        "envs": {
          "PLUGIN_DEBUG": "${{ inputs.debug }}",
          "PLUGIN_CORPID": "${{ inputs.corpid }}",
          "PLUGIN_CORP_SECRET": "${{ inputs.corp_secret }}",
          "PLUGIN_AGENT_ID": "${{ inputs.agent_id }}",
          "PLUGIN_MSGTYPE": "${{ inputs.msg_type }}",
          "PLUGIN_TO_USER": "${{ inputs.to_user }}",
          "PLUGIN_TO_PARTY": "${{ inputs.to_party }}",
          "PLUGIN_TO_TAG": "${{ inputs.to_tag }}",
          "PLUGIN_MESSAGE": "${{ inputs.message }}",
          "PLUGIN_TEMPLATE_FILE": "${{ inputs.template_file }}",
          "PLUGIN_TITLE": "${{ inputs.title }}",
          "PLUGIN_BTN_TXT": "${{ inputs.btn_txt }}",
          "PLUGIN_MSG_URL": "${{ inputs.msg_url }}",
          "PLUGIN_SAFE": "${{ inputs.safe }}",
          "PLUGIN_RENDER_ONLY": "${{ inputs.render_only }}",
          "PLUGIN_ENABLE_ID_TRANS": "${{ inputs.enable_id_trans }}"
        }
      }
    },
    "inputs": {
      "corpid": {
        "type": "string",
        "description": "The corpid for authorization",
        "required": true,
        "mask": true
      },
      "corp_secret": {
        "type": "string",
        "description": "The corp_secret for authorization",
        "required": true,
        "mask": true
      },
      "agent_id": {
        "type": "string",
        "description": "The agent id to send the message",
        "required": true
      },
      "msg_type": {
        "type": "string",
        "description": "The message type, choices text textcard markdown, default text"
      },
      "message": {
        "type": "string",
        "description": "Notification body message",
      },
      "template_file": {
        "type": "string",
        "description": "Render template file to message",
      },
      "title": {
        "type": "string",
        "description": "The title for the card"
      },
      "btn_txt": {
        "type": "string",
        "description": "The text for the button on the card"
      },
      "msg_url": {
        "type": "string",
        "description": "The link for the text card click"
      },
      "to_user": {
        "type": "string",
        "description": "The user id to send the message"
      },
      "to_party": {
        "type": "string",
        "description": "The party id to send the message"
      },
      "to_tag": {
        "type": "string",
        "description": "The tag id to send the message"
      },
      "safe": {
        "type": "boolean",
        "description": "encrypt message, default is false"
      },
      "render_only": {
        "type": "boolean",
        "description": "only render message, default is false"
      },
      "enable_id_trans": {
        "type": "boolean",
        "description": "allow wechat translate id, default is false"
      }
    }
  }
}
