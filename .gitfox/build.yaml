version: 1
kind: pipeline
spec:
  options:
    envs:
      REGISTRY_HOST: hub.zentao.net
      IMAGE_REPOSITORY: app/gitfox-community
  stages:
    - name: prepare
      type: ci
      spec:
        steps:
          - name: image tag
            type: run
            spec:
              container: hub.zentao.net/app/debian:11.8-slim
              script:
              - image_tag="v2.0-test-$(echo ${GITFOX_BRANCH:-release} | tr '/' '-')-$(date +%Y%m%d)"
              - echo "APP_IMAGE=${REGISTRY_HOST}/${IMAGE_REPOSITORY}:${image_tag}" >> $GITFOX_CUSTOM_ENV
          - name: 构建镜像
            type: run
            spec:
              container:
                image: hub.zentao.net/ci/docker-cli:27.3.1
              script:
              - docker login -u ${{ secrets.get("zentao-registry-docker-username") }} -p ${{ secrets.get("zentao-registry-docker-password") }} hub.zentao.net
              - docker buildx build --push --pull --platform linux/amd64 -f deploy/Dockerfile --push --pull -t "${APP_IMAGE}" . | setup-buildx-kubernetes
          - name: 消息通知
            type: plugin
            spec:
              inputs:
                debug: true
                custom: true
                token: ${{ secrets.get("xuan_token") }}
                caller: zenci
                api: https://gw.easycorp.cn
                title: GitFox 构建完成
                content: "镜像：{{.APP_IMAGE}}"
                url: ${GITFOX_BUILD_LINK}
                groups:
                  "0": 31a0008b-6e3e-4b7f-9b7b-396a46b1f8f4
              name: gitfox-xuanim-plugin