version: 1
kind: pipeline
spec:
  options:
    envs:
      REGISTRY_HOST: hub.zentao.net
      IMAGE_REPOSITORY: app/gitfox-community
  stages:
    - name: prepare
      type: ci
      spec:
        steps:
          - name: unit test
            type: run
            spec:
              container: hub.zentao.net/ci/golang:1.25-alpine3.22
              script:
              - go install github.com/go-task/task/v3/cmd/task@latest
              - task test:service