version: 1
kind: pipeline
spec:
  options:
    envs:
      REGISTRY_HOST: hub.zentao.net
      IMAGE_REPOSITORY: app/gitfox-community
  stages:
    - name: prepare
      type: ci
      spec:
        steps:
          - name: unit test
            type: run
            spec:
              container: hub.zentao.net/ci/golang:1.25-alpine3.22-junit-report
              script:
              - task test:service
              - echo "UNIT_TEST=$(printf "%q" "$(cat unit/unit_stats.txt)")" >> $GITFOX_CUSTOM_ENV
              - echo {{.UNIT_TEST}}
          - name: 消息通知
            type: plugin
            spec:
              inputs:
                debug: true
                custom: true
                token: ${{ secrets.get("xuan_token") }}
                caller: zenci
                api: https://gw.easycorp.cn
                title: gitfox-community单测执行完成
                content: {{.UNIT_TEST}}
                url: ${GITFOX_BUILD_LINK}
                users:
                  "0": "caiyan"
                # groups:
                  # "0": 31a0008b-6e3e-4b7f-9b7b-396a46b1f8f4
              name: gitfox-xuanim-plugin